<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practica de chat</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/main.js"></script>
  </head>

  <body>
    <section class="container">
      <ul class="chat-container"></ul>
      <form class="form" id="form">
        <input
          type="text"
          name="chat"
          id="input"
          placeholder="Escribe tu mensaje"
          autofocus
          autocomplete="false"
        />
        <button>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#ffffff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-send-2"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path
              d="M4.698 4.034l16.302 7.966l-16.302 7.966a.503 .503 0 0 1 -.546 -.124a.555 .555 0 0 1 -.12 -.568l2.468 -7.274l-2.468 -7.274a.555 .555 0 0 1 .12 -.568a.503 .503 0 0 1 .546 -.124"
            />
            <path d="M6.5 12h14.5" />
          </svg>
        </button>
      </form>
    </section>
    <section>
      <p id="userActive">Usuario Activo</p>
      <button id="btnLogout">Cerrar Sesion</button>
    </section>
  </body>
</html>
